d": "energyKwh", "unit": "kWh", "xLabels": ["11-03", "11-04", "11-05"], "yValues": [5499.6, 5302.3, 5449.9], "points": [{"timestamp": "2026-11-03T00:00:00+08:00", "energyKwh": 5499.6}, {"timestamp": "2026-11-04T00:00:00+08:00", "energyKwh": 5302.3}, {"timestamp": "2026-11-05T00:00:00+08:00", "energyKwh": 5449.9}], "dataSource": "simulated", "sourceMode": "simulated", "format": {}, "encodings": [{"channel": "X", "fieldRef": "timestamp"}, {"channel": "Y", "fieldRef": "energyKwh"}], "axes": {"y": {"title": "耗电量（kWh）", "minimum": 0, "scale": "LINEAR"}}, "legend": true, "seriesColors": {}, "tooltipFields": ["energyKwh"], "referenceLines": {"关注阈值": {"type": "LITERAL", "value": 700}}, "seriesKeys": ["timestamp", "energyKwh"], "fieldValues": {"totalAlarmCount": 5, "seriousAlarmCount": 2, "processingAlarmCount": 2, "deviceCount": 10, "runningDeviceCount": 9, "totalEnergyKwh": 16251.8, "totalCost": 11376.26, "averagePue": 1.78, "roomName": "A 机房", "logicalDate": "2026-11-03"}, "encodingXNote": "声明的横轴字段当前没有可用取值，仍按原有口径显示", "encodingDriven": false, "encodingNote": "声明的纵轴字段当前没有可用取值，仍按原有口径显示"}}]};

  const root = document.getElementById("root");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const only = new URLSearchParams(window.location.search).get("only");
  for (const region of PAYLOAD.regions || []) {
    if (only && region.regionId !== only) continue;
    const wrap = document.createElement("div");
    wrap.className = "harness-region";
    wrap.innerHTML = `<div class="harness-title">${esc(region.name || region.regionId)} <span class="text-[10px] font-normal text-slate-400">${esc(region.componentType)}</span></div><div class="region-body"></div>`;
    root.appendChild(wrap);
    const container = wrap.querySelector(".region-body");
    const ctx = { unit: (region.payload || {}).unit || "", defRegion: null, totalsByUnit: {}, payload: PAYLOAD };
    if (region.componentType === "TEXT") {
      window.WorkbenchTextMetric.renderText(container, region, ctx);
    } else if (region.componentType === "METRIC_GROUP") {
      window.WorkbenchTextMetric.renderMetricGroup(container, region, ctx);
    } else if (region.componentType === "METRIC_CARD") {
      window.WorkbenchTextMetric.renderMetricCard(container, region, ctx);
    } else if (region.componentType === "TABLE") {
      window.WorkbenchTable.renderTable(container, region, ctx);
    } else if (region.componentType === "CHART") {
      window.WorkbenchChart.renderChart(container, region, ctx);
    }
  }
  window.addEventListener("resize", () => {
    for (const chart of window.WorkbenchChart.instances || []) { try { chart.resize(); } catch (e) {} }
  });
