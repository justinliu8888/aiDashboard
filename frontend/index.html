<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 报表生成工作台 · FakeAgent 联调</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .no-bar::-webkit-scrollbar { width: 6px; height: 6px; }
  .no-bar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  pre.payload { max-height: 240px; overflow: auto; background: #0f172a; color: #e2e8f0; font-size: 11px; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-slate-100 text-slate-800">

<!-- ===== 顶部 ===== -->
<header class="shrink-0 h-14 bg-[#0d1f3a] flex items-center gap-6 px-6">
  <div class="flex items-center gap-2.5">
    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center">
      <iconify-icon icon="mdi:chart-box" class="text-white text-lg"></iconify-icon>
    </div>
    <span class="text-white font-semibold tracking-wide">云枢数据平台</span>
    <span class="text-[11px] text-slate-400 border border-slate-600 rounded px-1.5 py-0.5">FakeAgent 联调</span>
  </div>
  <div class="ml-auto flex items-center gap-3 text-xs text-slate-300">
    <span>后端: <span id="backend-url" class="mono text-emerald-300"></span></span>
    <span id="health-badge" class="hidden xl:flex items-center gap-1.5 text-[11px] text-emerald-300 bg-emerald-500/10 border border-emerald-500/30 rounded-md px-2 py-1">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>连接正常
    </span>
  </div>
</header>

<!-- ===== 主体 ===== -->
<div class="flex-1 flex overflow-hidden">

  <!-- 左侧：对话 -->
  <section class="w-[480px] shrink-0 border-r border-slate-200 bg-white flex flex-col">
    <div class="px-4 py-3 border-b border-slate-200 flex items-center gap-2">
      <iconify-icon icon="mdi:robot-outline" class="text-lg text-blue-600"></iconify-icon>
      <span class="font-semibold text-sm">AI 对话</span>
      <span id="state-badge" class="ml-auto text-[11px] px-2 py-0.5 rounded border bg-slate-50 text-slate-600 border-slate-200 mono">IDLE</span>
    </div>

    <!-- 快捷样例 -->
    <div class="px-4 py-2 border-b border-slate-100 bg-slate-50 flex flex-wrap gap-1.5">
      <button data-sample="1" class="sample-btn text-[11px] px-2 py-1 rounded bg-white border border-slate-200 hover:bg-blue-50 hover:border-blue-200">样例1·生成</button>
      <button data-sample="2" class="sample-btn text-[11px] px-2 py-1 rounded bg-white border border-slate-200 hover:bg-blue-50 hover:border-blue-200">样例2·信息不足</button>
      <button data-sample="3" class="sample-btn text-[11px] px-2 py-1 rounded bg-white border border-slate-200 hover:bg-blue-50 hover:border-blue-200">样例3·权限越界</button>
      <button data-sample="4" class="sample-btn text-[11px] px-2 py-1 rounded bg-white border border-slate-200 hover:bg-blue-50 hover:border-blue-200">样例4·分钟级</button>
      <button data-sample="5" class="sample-btn text-[11px] px-2 py-1 rounded bg-white border border-slate-200 hover:bg-blue-50 hover:border-blue-200">样例5·改7天</button>
      <button data-sample="6" class="sample-btn text-[11px] px-2 py-1 rounded bg-white border border-slate-200 hover:bg-blue-50 hover:border-blue-200">样例6·删趋势图</button>
      <button id="reset-btn" class="text-[11px] px-2 py-1 rounded bg-white border border-rose-200 text-rose-600 hover:bg-rose-50 ml-auto">清空</button>
    </div>

    <!-- 消息列表 -->
    <div id="messages" class="flex-1 overflow-y-auto no-bar p-4 space-y-3"></div>

    <!-- 输入框 -->
    <div class="shrink-0 border-t border-slate-200 p-3">
      <div class="flex items-end gap-2">
        <textarea id="input" rows="2" placeholder="输入自然语言描述，例如：生成 A 机房昨日能耗日报"
          class="flex-1 text-sm resize-none border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-400"></textarea>
        <button id="send-btn" class="shrink-0 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg">
          发送
        </button>
      </div>
    </div>
  </section>

  <!-- 右侧：响应可视化 -->
  <section class="flex-1 overflow-y-auto no-bar p-5 space-y-4">
    <!-- 概览 -->
    <div class="bg-white border border-slate-200 rounded-lg p-4">
      <div class="flex items-center gap-2 mb-3">
        <iconify-icon icon="mdi:information-outline" class="text-blue-600"></iconify-icon>
        <h3 class="font-semibold text-sm">响应概览</h3>
      </div>
      <div id="overview" class="text-xs grid grid-cols-2 gap-2 text-slate-600">
        <div>state: <span class="mono text-slate-900" id="ov-state">—</span></div>
        <div>conversationId: <span class="mono text-slate-900" id="ov-conv">—</span></div>
        <div>designSessionId: <span class="mono text-slate-900" id="ov-session">—</span></div>
        <div>baseDefinitionRevision: <span class="mono text-slate-900" id="ov-rev">—</span></div>
      </div>
    </div>

    <!-- 追问 -->
    <div id="questions-card" class="hidden bg-amber-50 border border-amber-200 rounded-lg p-4">
      <div class="flex items-center gap-2 mb-3">
        <iconify-icon icon="mdi:help-circle-outline" class="text-amber-600"></iconify-icon>
        <h3 class="font-semibold text-sm">需要补充信息</h3>
      </div>
      <div id="questions-list" class="space-y-2 text-sm"></div>
    </div>

    <!-- 拦截 -->
    <div id="blocks-card" class="hidden bg-rose-50 border border-rose-200 rounded-lg p-4">
      <div class="flex items-center gap-2 mb-3">
        <iconify-icon icon="mdi:alert-octagon-outline" class="text-rose-600"></iconify-icon>
        <h3 class="font-semibold text-sm">被拦截 / 不支持</h3>
      </div>
      <div id="blocks-list" class="space-y-2 text-sm"></div>
    </div>

    <!-- 策略草稿 -->
    <div id="policy-card" class="hidden bg-white border border-slate-200 rounded-lg p-4">
      <div class="flex items-center gap-2 mb-3">
        <iconify-icon icon="mdi:shield-key-outline" class="text-indigo-600"></iconify-icon>
        <h3 class="font-semibold text-sm">报表策略草稿</h3>
      </div>
      <div id="policy-body" class="text-xs text-slate-600"></div>
    </div>

    <!-- 定义草稿 -->
    <div id="definition-card" class="hidden bg-white border border-slate-200 rounded-lg p-4">
      <div class="flex items-center gap-2 mb-3">
        <iconify-icon icon="mdi:file-document-outline" class="text-blue-600"></iconify-icon>
        <h3 class="font-semibold text-sm">报表定义草稿</h3>
        <span id="definition-meta" class="ml-auto text-[11px] text-slate-500 mono"></span>
      </div>
      <div id="definition-body" class="space-y-2"></div>
    </div>

    <!-- ChangeSet -->
    <div id="changeset-card" class="hidden bg-white border border-slate-200 rounded-lg p-4">
      <div class="flex items-center gap-2 mb-3">
        <iconify-icon icon="mdi:file-swap-outline" class="text-fuchsia-600"></iconify-icon>
        <h3 class="font-semibold text-sm">修改草稿 (ChangeSet)</h3>
        <span id="cs-meta" class="ml-auto text-[11px] text-slate-500 mono"></span>
      </div>
      <div id="changeset-body" class="space-y-2 text-sm"></div>
    </div>

    <!-- UI Actions / Tool Requests -->
    <div class="grid grid-cols-2 gap-4">
      <div id="ui-card" class="bg-white border border-slate-200 rounded-lg p-4">
        <h3 class="font-semibold text-sm mb-2 flex items-center gap-2">
          <iconify-icon icon="mdi:gesture-tap-button" class="text-emerald-600"></iconify-icon>uiActions
        </h3>
        <div id="ui-list" class="flex flex-wrap gap-1.5"></div>
      </div>
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <h3 class="font-semibold text-sm mb-2 flex items-center gap-2">
          <iconify-icon icon="mdi:tools" class="text-slate-500"></iconify-icon>toolRequests
        </h3>
        <div id="tool-list" class="space-y-1 text-xs text-slate-600"></div>
      </div>
    </div>

    <!-- 原始 payload -->
    <details class="bg-white border border-slate-200 rounded-lg p-4">
      <summary class="cursor-pointer font-semibold text-sm flex items-center gap-2">
        <iconify-icon icon="mdi:code-json" class="text-slate-500"></iconify-icon>原始 Response Payload
      </summary>
      <pre id="raw-payload" class="payload mt-3">—</pre>
    </details>
  </section>
</div>

<script src="./app.js"></script>
</body>
</html>
