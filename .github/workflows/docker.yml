name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - backend/app/**
      - backend/requirements.txt
      - frontend/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check backend and frontend in container
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --detach --name dashboard-smoke "$IMAGE:latest"
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec dashboard-smoke python -c 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3); assert json.load(response)["status"] == "ok"'; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs dashboard-smoke
            exit 1
          fi
          docker exec dashboard-smoke python -c 'import urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/", timeout=5); assert response.status == 200; assert response.url.endswith("/playground/pages/workbench.html"); assert b"<html" in response.read().lower()'

      - name: Publish verified image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          echo "Published image: \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Container port: 8000. Persistent data directory: /data." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up test container
        if: always()
        run: docker rm --force dashboard-smoke || true
